name: Supabase keep-alive

# Free-tier Supabase projects pause after a week of inactivity.
# This pings the public REST API twice a week so the project stays awake.
# The URL and anon key below are the same public values already shipped in the
# website's JavaScript (the anon key is designed to be public; row-level security
# protects the data). Repository secrets of the same names override them if set.
on:
  schedule:
    - cron: '17 6 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query one temple
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://xgranzssqezpremxyegt.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhncmFuenNzcWV6cHJlbXh5ZWd0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0MjM1MzMsImV4cCI6MjEwMzk5OTUzM30.GePRdp1afPUnaOkdMg7ocKe5lcjE7GQWhz0PMdgsp6M' }}
        run: |
          curl --fail --silent --show-error \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/temples?select=id&limit=1"
